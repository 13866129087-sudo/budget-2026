<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026年6月 记账本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #EDEBE6;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.18);
    --text: #1A1917;
    --text2: #6B6860;
    --text3: #9B9890;
    --accent: #1D6F4F;
    --accent-bg: #E1F5EE;
    --warn: #A05C08;
    --warn-bg: #FEF3E2;
    --danger: #B02020;
    --danger-bg: #FDECEC;
    --mono: 'DM Mono', monospace;
    --sans: 'Noto Sans SC', sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem 1rem 4rem;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  header .month {
    font-size: 12px;
    font-family: var(--mono);
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  header .principle {
    font-size: 12px;
    color: var(--text3);
    margin-top: 6px;
    line-height: 1.6;
  }

  .max-w { max-width: 520px; margin: 0 auto; }

  /* Summary cards */
  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .sum-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.125rem; }
  .sum-card .lbl { font-size: 11px; color: var(--text3); letter-spacing: 0.05em; margin-bottom: 4px; }
  .sum-card .val { font-size: 24px; font-weight: 700; font-family: var(--mono); color: var(--text); }
  .sum-card .val.good { color: var(--accent); }
  .sum-card .val.bad { color: var(--danger); }
  .sum-card .sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* Progress bar */
  .global-bar-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .global-bar-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .global-bar-label span { font-size: 12px; color: var(--text2); }
  .global-bar-label strong { font-family: var(--mono); font-size: 13px; color: var(--text); }
  .track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .track-fill { height: 100%; border-radius: 4px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

  /* Category list */
  .section-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.625rem; }
  .section-hd h2 { font-size: 13px; font-weight: 500; color: var(--text2); letter-spacing: 0.04em; }

  .cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
  .cat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .cat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cat-name { font-size: 14px; font-weight: 500; }
  .cat-sub { font-size: 11px; color: var(--text3); margin-left: 6px; }
  .cat-nums { font-size: 12px; font-family: var(--mono); color: var(--text2); }
  .cat-nums em { color: var(--text); font-style: normal; font-weight: 500; }
  .cat-bar-wrap { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-bottom: 0; grid-column: 1 / -1; }
  .cat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
  .add-btn {
    grid-row: 1 / 3;
    grid-column: 2;
    align-self: center;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    color: var(--text2);
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .add-btn:hover { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }

  /* Log */
  .log-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .log-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 0.5px solid var(--border); gap: 8px; }
  .log-item:last-child { border-bottom: none; }
  .log-left { flex: 1; min-width: 0; }
  .log-cat { font-size: 13px; font-weight: 500; }
  .log-meta { font-size: 11px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .log-amt { font-family: var(--mono); font-size: 14px; font-weight: 500; }
  .log-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px; transition: color 0.15s; }
  .log-del:hover { color: var(--danger); }
  .empty-log { padding: 2rem; text-align: center; font-size: 13px; color: var(--text3); }

  /* Modal */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }
  @media (min-width: 480px) {
    .modal-bg { align-items: center; }
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 1.5rem 1.25rem 2rem;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.2s ease;
  }
  @media (min-width: 480px) {
    .modal { border-radius: var(--radius-lg); }
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
  .modal-hd h3 { font-size: 16px; font-weight: 700; }
  .modal-close { background: var(--surface2); border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; cursor: pointer; color: var(--text2); display: flex; align-items: center; justify-content: center; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; letter-spacing: 0.04em; }
  .field input {
    width: 100%; padding: 9px 12px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); background: var(--surface); }
  .field input#input-amt { font-family: var(--mono); font-size: 20px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 1.25rem; }
  .btn { flex: 1; padding: 10px; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); font-family: var(--sans); transition: background 0.15s; }
  .btn:hover { background: var(--surface2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn.primary:hover { background: #155c3f; }

  /* Badge */
  .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; letter-spacing: 0.03em; }
  .badge.good { background: var(--accent-bg); color: var(--accent); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--danger-bg); color: var(--danger); }

  /* Footer */
  footer { text-align: center; margin-top: 2rem; font-size: 11px; color: var(--text3); }
</style>
</head>
<body>
<div class="max-w">
  <header>
    <div class="month">June 2026</div>
    <h1>2026年6月 记账本</h1>
    <div class="principle">硬上限 ¥2,170 · 饮食先不砍 · 日用品压到30 · 水电60</div>
  </header>

  <div class="summary">
    <div class="sum-card">
      <div class="lbl">已花</div>
      <div class="val" id="spent-val">¥0</div>
      <div class="sub" id="spent-sub">共 0 笔</div>
    </div>
    <div class="sum-card">
      <div class="lbl">剩余</div>
      <div class="val good" id="remain-val">¥2,170</div>
      <div class="sub" id="remain-sub">距月底还有 <span id="days-left">—</span> 天</div>
    </div>
    <div class="sum-card">
      <div class="lbl">今日可用</div>
      <div class="val" id="daily-val">¥72</div>
      <div class="sub">按剩余天数摊</div>
    </div>
    <div class="sum-card">
      <div class="lbl">总进度</div>
      <div class="val" id="pct-val">0%</div>
      <div class="sub"><span id="status-badge" class="badge good">严控中</span></div>
    </div>
  </div>

  <div class="global-bar-wrap">
    <div class="global-bar-label">
      <span>预算使用进度</span>
      <strong id="global-bar-txt">¥0 / ¥2,170</strong>
    </div>
    <div class="track">
      <div class="track-fill" id="global-bar" style="width:0%;background:#1D6F4F"></div>
    </div>
  </div>

  <div class="section-hd"><h2>各项分类</h2></div>
  <div class="cat-list" id="cat-list"></div>

  <div class="section-hd"><h2>记录明细</h2></div>
  <div class="log-wrap" id="log-wrap">
    <div class="empty-log">还没有记录<br>点各分类的 + 开始记账</div>
  </div>

  <footer>数据保存在本设备浏览器 · 月份结束后可手动清除</footer>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-hd">
      <h3 id="modal-title">录入花销</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="field">
      <label>金额（元）</label>
      <input type="number" id="input-amt" placeholder="0.00" min="0" step="0.01" inputmode="decimal" />
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <input type="text" id="input-note" placeholder="例：午饭、地铁充值…" />
    </div>
    <div class="field">
      <label>日期</label>
      <input type="date" id="input-date" />
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="confirmAdd()">记账 ✓</button>
    </div>
  </div>
</div>

<script>
const BUDGET = 2170;
const DAYS = 30;

const CATS = [
  { id:'rent',    name:'住宿',     sub:'固定必需', budget:880,  color:'#0F6E56' },
  { id:'food',    name:'饮食',     sub:'生存必需', budget:500,  color:'#1D9E75' },
  { id:'util',    name:'水电燃气', sub:'固定必需', budget:60,   color:'#5DCAA5' },
  { id:'comm',    name:'通讯',     sub:'固定必需', budget:300,  color:'#378ADD' },
  { id:'daily',   name:'日用品',   sub:'可挪动',   budget:30,   color:'#7F77DD' },
  { id:'gym',     name:'健身',     sub:'健康维护', budget:160,  color:'#D4537E' },
  { id:'ai',      name:'AI会员费', sub:'工具/陪伴', budget:150,  color:'#BA7517' },
  { id:'reserve', name:'应急备用金',sub:'安全垫',   budget:90,   color:'#888780' },
];

let records = [];
try { records = JSON.parse(localStorage.getItem('jun26_v2') || '[]'); } catch(e) {}
let currentCat = null;

function save() {
  try { localStorage.setItem('jun26_v2', JSON.stringify(records)); } catch(e) {}
}

function catSpent(id) {
  return records.filter(r => r.cat === id).reduce((s,r) => s + r.amt, 0);
}
function totalSpent() {
  return records.reduce((s,r) => s + r.amt, 0);
}
function daysLeft() {
  const d = new Date();
  return Math.max(1, DAYS - d.getDate() + 1);
}
function barColor(ratio) {
  if (ratio >= 1) return '#B02020';
  if (ratio >= 0.8) return '#A05C08';
  return null;
}

function render() {
  const spent = totalSpent();
  const remain = BUDGET - spent;
  const ratio = spent / BUDGET;
  const dl = daysLeft();
  const daily = remain > 0 ? remain / dl : 0;
  const cnt = records.length;

  document.getElementById('spent-val').textContent = '¥' + Math.round(spent).toLocaleString();
  document.getElementById('spent-sub').textContent = '共 ' + cnt + ' 笔';

  const rv = document.getElementById('remain-val');
  rv.textContent = '¥' + Math.round(remain).toLocaleString();
  rv.className = 'val ' + (remain < 0 ? 'bad' : remain < 400 ? '' : 'good');
  document.getElementById('days-left').textContent = dl;

  document.getElementById('daily-val').textContent = '¥' + Math.max(0, Math.round(daily)).toLocaleString();
  document.getElementById('pct-val').textContent = Math.round(ratio * 100) + '%';

  const badge = document.getElementById('status-badge');
  if (ratio >= 1) { badge.textContent = '已超支'; badge.className = 'badge bad'; }
  else if (ratio >= 0.85) { badge.textContent = '接近上限'; badge.className = 'badge warn'; }
  else { badge.textContent = '严控中'; badge.className = 'badge good'; }

  const gb = document.getElementById('global-bar');
  const pct = Math.min(ratio * 100, 100);
  gb.style.width = pct.toFixed(1) + '%';
  gb.style.background = ratio >= 1 ? '#B02020' : ratio >= 0.8 ? '#A05C08' : '#1D6F4F';
  document.getElementById('global-bar-txt').textContent = '¥' + Math.round(spent) + ' / ¥' + BUDGET;

  // Cat list
  const cl = document.getElementById('cat-list');
  cl.innerHTML = '';
  CATS.forEach(cat => {
    const s = catSpent(cat.id);
    const r = s / cat.budget;
    const pct = Math.min(r * 100, 100);
    const bc = barColor(r) || cat.color;
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.innerHTML = `
      <div>
        <div class="cat-top">
          <div><span class="cat-name">${cat.name}</span><span class="cat-sub">${cat.sub}</span></div>
          <div class="cat-nums"><em>¥${Math.round(s)}</em> / ¥${cat.budget}</div>
        </div>
        <div class="cat-bar-wrap">
          <div class="cat-bar-fill" style="width:${pct.toFixed(1)}%;background:${bc}"></div>
        </div>
      </div>
      <button class="add-btn" onclick="openModal('${cat.id}','${cat.name}')">+</button>
    `;
    cl.appendChild(card);
  });

  // Log
  const lw = document.getElementById('log-wrap');
  if (records.length === 0) {
    lw.innerHTML = '<div class="empty-log">还没有记录<br>点各分类的 + 开始记账</div>';
    return;
  }
  const sorted = [...records].sort((a,b) => b.ts - a.ts);
  lw.innerHTML = sorted.map(r => {
    const cat = CATS.find(c => c.id === r.cat);
    const d = new Date(r.date);
    const dStr = (d.getMonth()+1) + '月' + d.getDate() + '日';
    return `<div class="log-item">
      <div class="log-left">
        <div class="log-cat">${cat ? cat.name : r.cat}</div>
        <div class="log-meta">${dStr}${r.note ? ' · ' + r.note : ''}</div>
      </div>
      <div class="log-right">
        <span class="log-amt">¥${r.amt.toFixed(2)}</span>
        <button class="log-del" onclick="del('${r.id}')">×</button>
      </div>
    </div>`;
  }).join('');
}

function openModal(catId, catName) {
  currentCat = catId;
  document.getElementById('modal-title').textContent = '录入 · ' + catName;
  document.getElementById('input-amt').value = '';
  document.getElementById('input-note').value = '';
  document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(() => document.getElementById('input-amt').focus(), 100);
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
  currentCat = null;
}
function confirmAdd() {
  const amt = parseFloat(document.getElementById('input-amt').value);
  if (!amt || amt <= 0) { document.getElementById('input-amt').focus(); return; }
  const note = document.getElementById('input-note').value.trim();
  const date = document.getElementById('input-date').value || new Date().toISOString().split('T')[0];
  records.push({ id: Math.random().toString(36).slice(2), cat: currentCat, amt, note, date, ts: Date.now() });
  save(); closeModal(); render();
}
function del(id) {
  if (!confirm('删除这条记录？')) return;
  records = records.filter(r => r.id !== id);
  save(); render();
}

document.getElementById('modal-bg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modal-bg').classList.contains('open')) confirmAdd();
});

render();
</script>
</body>
</html>
